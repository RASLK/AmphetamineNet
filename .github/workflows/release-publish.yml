# Reusable "publish" step: turns already-built macOS artifacts (uploaded by
# macos-pack.yml earlier in the same run) into a GitHub Release + Homebrew cask.
# Called by release.yml (manual tag) and release-branch.yml (auto-bumped tag).

name: Release (publish)

on:
  workflow_call:
    inputs:
      version:
        description: Version without leading v (e.g. 1.0.0)
        required: true
        type: string
      tag:
        description: Full tag (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Homebrew cask
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ inputs.version }}'
          TAG='${{ inputs.tag }}'
          REPO='${{ github.repository }}'
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Читаем хэши файлов
          ARM_SHA256=$(awk '{print $1}' "artifacts/AmphetamineNet-${VERSION}-macos-arm64.dmg.sha256sum")
          INTEL_SHA256=$(awk '{print $1}' "artifacts/AmphetamineNet-${VERSION}-macos-intel.dmg.sha256sum")

          mkdir -p artifacts/homebrew

          # Генерируем Ruby-файл каска напрямую средствами Bash (HereDoc)
          cat << EOF > artifacts/homebrew/amphetaminenet.rb
          cask "amphetaminenet" do
            version "${VERSION}"
            sha256 arm: "${ARM_SHA256}", intel: "${INTEL_SHA256}"

            on_arm do
              url "${RELEASE_URL}/AmphetamineNet-${VERSION}-macos-arm64.dmg"
            end

            on_intel do
              url "${RELEASE_URL}/AmphetamineNet-${VERSION}-macos-intel.dmg"
            end

            name "AmphetamineNet"
            desc "macOS menu bar utility that keeps your Mac awake"
            homepage "https://github.com/${REPO}"

            auto_updates true
            app "AmphetamineNet.app"

            postflight do
              system_command "/usr/bin/xattr",
                              args: ["-cr", "#{appdir}/AmphetamineNet.app"],
                              sudo: false
            end
          end
          EOF

          # Копируем созданный файл во второе нужное расположение
          cp artifacts/homebrew/amphetaminenet.rb "artifacts/AmphetamineNet-${VERSION}-homebrew-cask.rb"

          echo "Generated artifacts/homebrew/amphetaminenet.rb"
          echo "Generated artifacts/AmphetamineNet-${VERSION}-homebrew-cask.rb"

      - name: List assets
        run: ls -lh artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: AmphetamineNet ${{ inputs.tag }}
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Downloads

            | Platform | Installer |
            | --- | --- |
            | macOS Apple Silicon | `AmphetamineNet-*-macos-arm64.dmg` |
            | macOS Intel | `AmphetamineNet-*-macos-intel.dmg` |
            | Homebrew Cask | `AmphetamineNet-*-homebrew-cask.rb` |

            Each package has a matching **`.sha256sum`** — verify with:
            `shasum -a 256 -c AmphetamineNet-….sha256sum`

            The release also includes a ready-to-publish Homebrew cask file. Copy it into your tap repository, update the cask filename if needed, and publish the tap commit.

            **Unsigned build:** if Gatekeeper blocks the app, right-click → **Open**.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Tap repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Cask
        run: |
          # Создаем папку Casks, если её нет
          mkdir -p homebrew-tap/Casks

          # Копируем сгенерированный каск
          cp artifacts/homebrew/amphetaminenet.rb homebrew-tap/Casks/

          # Коммитим и пушим в Tap-репозиторий
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/amphetaminenet.rb

          # Если изменений нет (например, перезапуск джобы), не падаем с ошибкой
          git commit -m "Update AmphetamineNet to ${{ inputs.version }}" || echo "No changes to commit"
          git push
